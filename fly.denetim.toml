# Denetim logu test uygulaması (README "Denetim logu"). fly.toml'ın kopyası; yalnız dört satır farklı:
# uygulama adı, makinenin boştayken durması (auto_stop_machines, min_machines_running) ve TKGM makine
# sayısı. Ad "arthurlegal-mcp" olamaz: denetim.py o adda kaydı açmaz. Kayma testi: tests/test_denetim.py.
#
#   flyctl deploy . -c fly.denetim.toml --dockerfile Dockerfile.code --depot=false

app = "arthurlegal-mcp-denetim"
primary_region = "ams"

[build]

# Not secrets, and deliberately visible: when semantic search misbehaves the
# first question is always which endpoint and which model were actually used.
[env]
  EMBEDDINGS_URL = "https://api.voyageai.com/v1/embeddings"
  EMBEDDINGS_MODEL = "voyage-4-lite"
  # tkgm_canli bütçesi süreç başınadır (tkgm-mcp/docs/MANIFESTO.md); test uygulamasında tek makine.
  TKGM_MAKINE_SAYISI = "1"
  # e-qanun.az does not answer from Amsterdam (10 s timeouts, 2026-10-09); the az_ tools
  # tunnel through az-relay in Frankfurt over the private network (az-relay/README.md).
  EQANUN_PROXY = "http://arthurlegal-az-relay.internal:8080"
  # Vectors kept in memory as float16 (retrieval.py), ~141 MB for all six indexes.
  # At 512 MB they starved the page cache of the SQLite files: Turkish and Polish
  # searches went from ~1.2 s to 7-8 s, keyword searches included. At 1 GB (below)
  # meaning searches got faster instead, hybrid median NL 1,054 -> 522 ms, PL
  # 1,283 -> 725, TR 1,198 -> 877, with ~530 MB left free (2026-10-10).
  SEMANTIC_RESIDENT_MB = "160"

[http_service]
  internal_port = 8080
  force_https = true
  # Test uygulaması yalnız ölçüm sırasında kullanılır: boştayken durur, ilk istekte kalkar.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Requests in flight per machine. Past the soft limit Fly's proxy sends new requests to the other
# machine; past the hard limit it queues them instead of piling threads onto one shared vCPU. Counted
# per request, not per connection: Claude keeps connections open between calls.
[http_service.concurrency]
  type = "requests"
  soft_limit = 15
  hard_limit = 30

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # The process holds ~230-300 MB (about 140 MB of it the resident vectors, measured through
  # status in October-November 2026); the rest is the page cache for ~2 GB of SQLite
  # files, which the Turkish and Polish searches lean on: at 512 MB, 141 MB of
  # resident vectors starved it and those searches took 7-8 s (2026-10-10).
  memory = "1gb"
